name: buid_arch
description: BUID ARCh - Flutter app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  local_auth: 2.3.0
  shared_preferences: ^2.5.6
  http: ^1.5.0
  flutter_secure_storage: ^11.2.0
